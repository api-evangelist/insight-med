aid: insight-med
name: Insight Lifetech
description: >-
  Insight Lifetech (Shenzhen North Star Cardiovascular Medical Technology,
  北芯生命科技) is a Chinese medical-technology company developing innovative
  solutions for the precision diagnosis and treatment of cardiovascular
  diseases. Its portfolio spans coronary physiology and intravascular imaging
  (FFR, IVUS) and cardiac electrophysiology, including its InsightPFA pulsed-field
  ablation platform. Backed by Qiming Venture Partners, the company listed on the
  Shanghai Stock Exchange STAR Market (688712) in February 2026. This is a
  medical-device manufacturer with no public developer or API surface; the
  profile is maintained in the API Evangelist network for company intelligence.
